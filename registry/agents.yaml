# The user's agents and MCP connections, defined once and shared by every project.
# `connections` are declared, not detected: what each agent can reach today.
# Last checked 2026-10-02 on the Windows host (see docs/model.md §7).

agents:
  - id: claude-code
    name: Claude Code
    status: active
    runs: [local, cloud]
    surfaces: [desktop, cli, vscode, mobile, web]
    capabilities: [code, review, subagents]
    instructions:
      entry: CLAUDE.md
      via: "CLAUDE.md imports @AGENTS.md"
      imports: "@AGENTS.md"
    project_mcp: { path: .mcp.json, format: mcp-json }
    extensions: [hooks, subagents, commands, skills, plugins, mcp]
    mcp_config: ".mcp.json (project), ~/.claude.json (user), claude.ai connectors (account)"
    branch_prefixes: [claude]
    connections:
      mcp: [google-drive, gmail, notion]   # claude.ai connectors seen in a desktop session
      cli: [git, gh, npm]
    notes:
      - "Cloud and mobile sessions see only what is committed to the repo."

  - id: codex
    name: Codex
    status: active
    runs: [local, cloud]
    surfaces: [desktop, cli, vscode, cloud]
    capabilities: [code, review, computer-use]
    instructions:
      entry: AGENTS.md
      max_bytes: 32768   # project_doc_max_bytes default; unverified against the installed version
    extensions: [skills, rules, plugins, automations, mcp]
    mcp_config: "~/.codex/config.toml [mcp_servers]"
    branch_prefixes: [codex]
    connections:
      mcp: [node_repl]
      cli: [git, gh, npm]
    notes:
      - "Has its own automations, queue and memories; do not duplicate them here."

  - id: grok-bot
    name: Grok Bot
    status: occasional
    runs: [cloud]
    surfaces: [desktop]
    capabilities: [code]
    instructions:
      entry: AGENTS.md
      via: "unverified: Cursor-based, expected to read AGENTS.md"
    extensions: [routines, mcp]
    mcp_config: "~/.grokbot/settings.json mcpBoxServers"
    branch_prefixes: [cursor]   # PR #95 head: cursor/doctor-fixtures-87-15e5
    connections:
      mcp: []
      cli: []
      native: [github]   # runs coding jobs as GitHub PRs (seen: "AI2-25/#87 … Run failed · #95")
    notes:
      - "Works in the cloud on pushed branches; it cannot see local, uncommitted files."

  - id: antigravity
    name: Antigravity / Gemini CLI
    status: occasional
    runs: [local]
    surfaces: [cli]
    capabilities: [code, image-generation]
    instructions:
      entry: AGENTS.md
    extensions: [hooks, rules, mcp]
    mcp_config: "~/.gemini/settings.json mcpServers"
    connections:
      mcp: []
      cli: [git]
    notes:
      - "Hook commands run with cwd = the directory holding hooks.json, not the repo root."
      - "Print mode (-p) ignores project hooks unless --add-dir <repo> is passed."

# MCP servers by name, as resources refer to them (`access: {via: mcp, tool: <id>}`).
# `verified: false` = taken from memory of the provider's docs; check before relying on it.
connections:
  - id: linear
    name: Linear
    url: https://mcp.linear.app/mcp
    auth: oauth
    verified: false
  - id: github
    name: GitHub
    url: https://api.githubcopilot.com/mcp/
    auth: oauth
    verified: false
  - id: google-drive
    name: Google Drive
    per_agent:
      claude-code: "claude.ai connector: Settings → Connectors → Google Drive"
    note: No portable MCP endpoint; each agent has its own integration, if any.
